name: Push Selected Files to Collaboration Repo

on:
  push:
    branches:
      - collab-release

jobs:
  sync-to-collab-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo (this one)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: collab-release

      - name: Clone the collaboration repository
        run: |
          git clone https://x-access-token:${{ secrets.COLLAB_PUSH_TOKEN }}@github.com/danielwolff1/test-release.git ../collab-repo

      - name: Rsync selected folders into collaboration repo
        run: |
          rsync -av --delete src/ ../collab-repo/src/
          rsync -av --delete examples/ ../collab-repo/examples/
          rsync -av --delete tests/ ../collab-repo/tests/
        # `--delete` ensures removed files are also deleted in the target

      - name: Commit and push changes to collab repo
        working-directory: ../collab-repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          
          git add src/ examples/ tests/
          if ! git diff --cached --quiet; then
            git commit -m "Sync from collab-release branch"
            git push origin main
          else
            echo "No changes to commit"
          fi